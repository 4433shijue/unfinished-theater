name: Build release draft

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true
      - name: Check tag matches source version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          test "$TAG" = "v$version" || { echo 'Tag must match pubspec.yaml version'; exit 1; }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --no-pub
      - run: flutter build web --release --no-pub
      - name: Restore release signing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          required = ('KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_PASSWORD', 'KEY_ALIAS')
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit('Missing signing secrets: ' + ', '.join(missing))
          Path('android/release.jks').write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          def escape(value):
              data = value.encode('utf-16-be')
              return ''.join('\\u%04x' % int.from_bytes(data[i:i+2], 'big') for i in range(0, len(data), 2))
          values = {'storeFile': 'release.jks', 'storePassword': os.environ['STORE_PASSWORD'], 'keyPassword': os.environ['KEY_PASSWORD'], 'keyAlias': os.environ['KEY_ALIAS']}
          Path('android/key.properties').write_text('\n'.join(k + '=' + escape(v) for k, v in values.items()), encoding='ascii')
          PY
      - name: Build signed Android APK
        env:
          REQUIRE_RELEASE_SIGNING: 'true'
        run: flutter build apk --release --no-pub
      - name: Package downloads
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p build/downloads
          cp build/app/outputs/flutter-apk/app-release.apk "build/downloads/unfinished-theater-$TAG-android.apk"
          (cd build/web && zip -qr "../downloads/unfinished-theater-$TAG-web.zip" .)
          (cd build/downloads && sha256sum *.apk *.zip > SHA256SUMS.txt)
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --generate-notes --title "未完剧场 $TAG"
          fi
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true || { echo 'Refusing to overwrite a published release'; exit 1; }
          gh release upload "$TAG" build/downloads/* --clobber
      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties android/release.jks
